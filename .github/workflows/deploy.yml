name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: printenv | sort
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_KEY: ${{ vars.API_KEY }}
